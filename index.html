<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Watch Together Online</title>
    <link rel="icon" href="data:," />
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #000;
            color: #fff;
            overflow-x: hidden;
        }

        #tsparticles {
            position: fixed;
            inset: 0;
            z-index: -1;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 32px;
        }

        .top-controls {
            margin-bottom: 20px;
        }

        input, button {
            padding: 10px 12px;
            border-radius: 8px;
            border: none;
            margin: 5px;
        }

        button {
            cursor: pointer;
            font-weight: bold;
        }

        #createBtn {
            background: #22c55e;
            color: white;
        }

        #joinBtn {
            background: #2563eb;
            color: white;
        }

        #fullscreenBtn {
            background: #f59e0b;
            color: white;
        }

        #roomDisplay {
            margin-top: 10px;
            font-size: 14px;
        }

        #roomLink {
            width: 260px;
            max-width: 100%;
        }

        .video-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 20px;
        }

        video {
            width: 100%;
            min-height: 260px;
            background: #111;
            border: 1px solid #333;
            border-radius: 12px;
            object-fit: cover;
        }

        .info-bar {
            margin-top: 10px;
            font-size: 14px;
        }

        .chat-container {
            margin-top: 20px;
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 16px;
            text-align: left;
        }

        #chatBox {
            height: 180px;
            overflow-y: auto;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            background: rgba(0, 0, 0, 0.5);
        }

        .chat-message {
            margin-bottom: 8px;
            font-size: 14px;
        }

        .chat-controls {
            display: flex;
            gap: 10px;
        }

        .chat-controls input {
            flex: 1;
        }

        #sendChatBtn {
            background: #9333ea;
            color: white;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            opacity: 0.8;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .video-section {
                grid-template-columns: 1fr;
            }

            .chat-controls {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div id="tsparticles"></div>

    <div class="container">
        <h1>WATCH-TOGETHER ONLINE</h1>

        <div class="top-controls">
            <button id="createBtn">Create Room</button><br />
            <input id="roomInput" placeholder="Enter Room ID" />
            <button id="joinBtn">Join Room</button><br />
            <button id="fullscreenBtn">Toggle Full Screen</button>

            <div id="roomDisplay"></div>
        </div>

        <div class="video-section">
            <video id="localVideo" autoplay muted playsinline></video>
            <video id="remoteVideo" autoplay playsinline></video>
        </div>

        <div class="info-bar">
            <span id="viewerCount">Viewers: 0</span>
        </div>

        <div class="chat-container">
            <h3>Room Chat</h3>
            <div id="chatBox"></div>
            <div class="chat-controls">
                <input id="chatInput" placeholder="Type message..." />
                <button id="sendChatBtn">Send</button>
            </div>
        </div>

        <footer>@2026 build by Nithish</footer>
    </div>

    <script>
        tsParticles.load("tsparticles", {
            particles: {
                number: { value: 80 },
                size: { value: 2 },
                move: { enable: true, speed: 1 },
                links: {
                    enable: true,
                    distance: 120,
                    color: "#ffffff",
                    opacity: 0.2,
                    width: 1
                },
                color: { value: "#ffffff" }
            },
            background: { color: "transparent" }
        });
    </script>

    <script src="script.js"></script>
</body>
</html>
