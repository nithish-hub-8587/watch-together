<!DOCTYPE html>
<html>
<head>
    <title>Live Screen Share</title>
    <script src="/socket.io/socket.io.js"></script>
    <script defer src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #000000, #000000);
            color: white;
            text-align: center;
            overflow-x: hidden;
        }

        h1 {
            margin-top: 20px;
            font-size: 32px;
            animation: fadeDown 1s ease;
        }

        .controls {
            margin-top: 20px;
            animation: fadeUp 1s ease;
        }

        input {
            padding: 10px;
            border-radius: 8px;
            border: none;
            width: 200px;
            margin-right: 10px;
        }

        button {
            padding: 10px 18px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .create-btn {
            background: #099b3f;
            color: white;
        }

        .join-btn {
            background: #000000;
            color: white;
        }

        .fullscreen-btn {
            background: #f59e0b;
            color: white;
            margin-top: 10px;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255,255,255,0.3);
        }

        #roomDisplay {
            margin-top: 15px;
            font-weight: bold;
            opacity: 0.8;
        }

        .videos {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            animation: fadeUp 1.2s ease;
        }

        video {
            width: 45%;
            border-radius: 15px;
            border: 2px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease;
        }

        video:hover {
            transform: scale(1.02);
        }

        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        #tsparticles {
    position: fixed;
    width: 100%;
    height: 100%;
    z-index: -1;
}

    </style>
</head>

<body>

    <h1>WATCH-TOGRTHER ONLINE</h1>

    <div class="controls">
        <button id="createBtn" class="create-btn">Create Room</button>
        <br><br>
        <input id="roomInput" placeholder="Enter Room ID" />
        <button id="joinBtn" class="join-btn">Join Room</button>
        <br>
        <button id="fullscreenBtn" class="fullscreen-btn">Toggle Full Screen</button>

        <div id="roomDisplay"></div>
    </div>

    <div class="videos">
        <video id="localVideo" autoplay muted playsinline></video>
        <video id="remoteVideo" autoplay playsinline></video>
    </div>
    <div id="tsparticles"></div>
    <div id="viewerCount">Viewers: 1</div>
    <script src="https://cdn.jsdelivr.net/npm/particles.js"></script>
    <div id="particles-js"></div>












    <h2>@2026 build by Nithish</h2>

</body>
</html>
<script>
tsParticles.load("tsparticles", {
    particles: {
        number: { value: 80 },
        size: { value: 3 },
        move: { enable: true, speed: 1 },
        links: {
            enable: true,
            distance: 150,
            color: "#ffffff",
            opacity: 0.2,
            width: 1
        },
        color: { value: "#ffffff" }
    },
    background: {
        color: "transparent"
    }
});
particlesJS("particles-js", {
  particles: {
    number: { value: 80 },
    size: { value: 3 },
    move: { speed: 2 },
    line_linked: { enable: true }
  }
});
</script>
